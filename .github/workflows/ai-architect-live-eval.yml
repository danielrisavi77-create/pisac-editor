name: AI Architect Live Eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promptfoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY GitHub Actions secret is required for this manual live eval."
            exit 1
          fi
      - name: Run Promptfoo comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p .ai/runtime
          npx --yes promptfoo@latest eval             -c .ai/evals/promptfooconfig.yaml             --no-table             --output .ai/runtime/promptfoo-results.json
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: ai-architect-promptfoo-results
          path: .ai/runtime/promptfoo-results.json
          if-no-files-found: error
