name: AI Architect Live Eval

on:
  workflow_dispatch:
    inputs:
      confirm_paid_calls:
        description: "Type YES to confirm this manual workflow may spend provider credits."
        required: true
        type: string

permissions:
  contents: read

jobs:
  promptfoo-live-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Require explicit paid-call confirmation
        env:
          CONFIRM_PAID_CALLS: ${{ inputs.confirm_paid_calls }}
        run: |
          if [ "$CONFIRM_PAID_CALLS" != "YES" ]; then
            echo "Paid live benchmark cancelled: set confirm_paid_calls=YES."
            exit 1
          fi

      - name: Require OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY GitHub Actions secret is required for this manual live eval."
            exit 1
          fi

      - name: Run Promptfoo live benchmark and quality gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p .ai/runtime
          npx --yes promptfoo@latest eval \
            -c .ai/evals/promptfooconfig.yaml \
            --no-table \
            --output .ai/runtime/promptfoo-results.json

      - name: Upload live eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architect-promptfoo-results
          path: .ai/runtime/promptfoo-results.json
          if-no-files-found: warn
