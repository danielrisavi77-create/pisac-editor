name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: d3555e93-3e6b-453f-9a28-062df5fdc4bf # pisac-demo.netlify.app (not a secret)
    steps:
      - name: Check for Netlify token
        id: gate
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "NETLIFY_AUTH_TOKEN secret is not set — skipping deploy (add it in Settings → Secrets and variables → Actions)."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - name: Build and deploy
        if: steps.gate.outputs.skip != 'true'
        run: npx --yes netlify-cli@23 deploy --build --prod --site "$NETLIFY_SITE_ID" --message "GitHub Actions deploy $GITHUB_SHA"
